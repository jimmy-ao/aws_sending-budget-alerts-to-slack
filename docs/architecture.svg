<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="548" viewBox="0 0 1140 548" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>AWS Budget Alerts to Slack — architecture</title>
  <defs>
    <marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker>
    <marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606A"/></marker>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8C959F"/></marker>
    <style>
      .card { fill: #FFFFFF; stroke: #D0D7DE; stroke-width: 1; }
      .note { fill: #F6F8FA; stroke: #D0D7DE; stroke-width: 1; }
      .title { font-size: 14px; font-weight: 600; fill: #1F2328; }
      .sub { font-size: 12px; fill: #57606A; }
      .nh { font-size: 12px; font-weight: 600; fill: #1F2328; }
      .nt { font-size: 11px; fill: #57606A; }
      .lbl { font-size: 11px; fill: #1F2328; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
      .bt { font-size: 13px; font-weight: 600; }
      .glyph { font-size: 17px; font-weight: 700; fill: #FFFFFF; }
      .ico { fill: none; stroke: #FFFFFF; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .conn { stroke: #8C959F; stroke-width: 1; stroke-dasharray: 2 3; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="1139" height="547" rx="16" fill="#FFFFFF" stroke="#D0D7DE"/>

  <!-- AWS workload account -->
  <rect x="24" y="24" width="812" height="284" rx="12" fill="#FFF8F0" stroke="#F59F00" stroke-width="1.5"/>
  <text x="44" y="52" class="bt" fill="#A35200">AWS workload account <tspan font-weight="400" fill="#8C959F">· eu-north-1</tspan></text>

  <!-- Slack workspace -->
  <rect x="880" y="24" width="236" height="284" rx="12" fill="#F8F3F8" stroke="#4A154B" stroke-width="1.5"/>
  <text x="900" y="52" class="bt" fill="#4A154B">Slack workspace</text>

  <!-- AWS shared services account -->
  <rect x="320" y="344" width="236" height="144" rx="12" fill="#F4F9EC" stroke="#7AA116" stroke-width="1.5"/>
  <text x="340" y="372" class="bt" fill="#4D6B0B">AWS shared services account</text>

  <!-- Budgets -->
  <rect x="56" y="76" width="170" height="84" rx="10" class="card"/>
  <circle cx="90" cy="118" r="18" fill="#3F8624"/>
  <text x="90" y="124" class="glyph" text-anchor="middle">$</text>
  <text x="116" y="113" class="title">AWS Budgets</text>
  <text x="116" y="132" class="sub">Monthly, USD</text>

  <!-- SNS -->
  <rect x="345" y="76" width="170" height="84" rx="10" class="card"/>
  <circle cx="379" cy="118" r="18" fill="#E7157B"/>
  <rect x="370" y="112" width="18" height="12" rx="1.5" class="ico"/>
  <polyline points="370,112 379,119 388,112" class="ico"/>
  <text x="405" y="113" class="title">SNS topic</text>
  <text x="405" y="132" class="sub">budget-to-slack</text>

  <!-- Amazon Q -->
  <rect x="634" y="76" width="170" height="84" rx="10" class="card"/>
  <circle cx="668" cy="118" r="18" fill="#7B42F6"/>
  <text x="668" y="124" class="glyph" text-anchor="middle">Q</text>
  <text x="694" y="113" class="title">Amazon Q</text>
  <text x="694" y="132" class="sub">Developer</text>

  <!-- Slack channel -->
  <rect x="902" y="76" width="192" height="84" rx="10" class="card"/>
  <circle cx="936" cy="118" r="18" fill="#4A154B"/>
  <text x="936" y="124" class="glyph" text-anchor="middle">#</text>
  <text x="962" y="113" class="title">Private channel</text>
  <text x="962" y="132" class="sub" font-size="11">aws-budget-alerting</text>

  <!-- Alert flow arrows -->
  <line x1="226" y1="118" x2="343" y2="118" stroke="#D9480F" stroke-width="2" marker-end="url(#aA)"/>
  <line x1="515" y1="118" x2="632" y2="118" stroke="#D9480F" stroke-width="2" marker-end="url(#aA)"/>
  <line x1="804" y1="118" x2="900" y2="118" stroke="#D9480F" stroke-width="2" marker-end="url(#aA)"/>

  <g text-anchor="middle">
    <circle cx="285.5" cy="118" r="9" fill="#D9480F"/><text x="285.5" y="122" font-size="11" font-weight="700" fill="#FFFFFF">1</text>
    <text x="285.5" y="144" class="lbl">threshold crossed</text>
    <circle cx="574.5" cy="118" r="9" fill="#D9480F"/><text x="574.5" y="122" font-size="11" font-weight="700" fill="#FFFFFF">2</text>
    <text x="574.5" y="144" class="lbl">notification</text>
    <circle cx="858" cy="118" r="9" fill="#D9480F"/><text x="858" y="122" font-size="11" font-weight="700" fill="#FFFFFF">3</text>
    <text x="858" y="144" class="lbl">posts alert</text>
  </g>

  <!-- Notes -->
  <line x1="141" y1="160" x2="141" y2="190" class="conn"/>
  <rect x="56" y="190" width="170" height="96" rx="8" class="note"/>
  <text x="68" y="212" class="nh">5 alerts</text>
  <text x="68" y="232" class="nt">ACTUAL 80 %, 100 %</text>
  <text x="68" y="250" class="nt">FORECASTED 50/75/100 %</text>
  <text x="68" y="268" class="nt">Limit from variables</text>

  <line x1="430" y1="160" x2="430" y2="190" class="conn"/>
  <rect x="345" y="190" width="170" height="96" rx="8" class="note"/>
  <text x="357" y="212" class="nh">Topic policy</text>
  <text x="357" y="232" class="nt">Publish only by</text>
  <text x="357" y="250" class="nt">budgets.amazonaws.com</text>
  <text x="357" y="268" class="nt">from this account</text>

  <line x1="719" y1="160" x2="719" y2="190" class="conn"/>
  <rect x="634" y="190" width="170" height="96" rx="8" class="note"/>
  <text x="646" y="212" class="nh">Least privilege</text>
  <text x="646" y="232" class="nt">Role: CloudWatch read</text>
  <text x="646" y="250" class="nt">Guardrail: same scope</text>
  <text x="646" y="268" class="nt">User auth required</text>

  <line x1="998" y1="160" x2="998" y2="190" class="conn"/>
  <rect x="902" y="190" width="192" height="96" rx="8" class="note"/>
  <text x="914" y="212" class="nh">Set up once</text>
  <text x="914" y="232" class="nt">Amazon Q bot + team</text>
  <text x="914" y="250" class="nt">invited by slack/ scripts</text>
  <text x="914" y="268" class="nt">Revoke the token after</text>

  <!-- Laptop -->
  <rect x="56" y="388" width="170" height="80" rx="10" class="card"/>
  <circle cx="90" cy="428" r="18" fill="#57606A"/>
  <rect x="82" y="420" width="16" height="11" rx="1.5" class="ico"/>
  <line x1="79" y1="435" x2="101" y2="435" class="ico"/>
  <text x="116" y="423" class="title">Laptop</text>
  <text x="116" y="442" class="sub">Terraform + uv</text>

  <!-- S3 state -->
  <rect x="344" y="388" width="188" height="80" rx="10" class="card"/>
  <circle cx="378" cy="428" r="18" fill="#7AA116"/>
  <ellipse cx="378" cy="421" rx="8" ry="3" class="ico"/>
  <path d="M370,421 V435 A8,3 0 0 0 386,435 V421" class="ico"/>
  <text x="404" y="423" class="title">S3 bucket</text>
  <text x="404" y="442" class="sub">Terraform state</text>

  <!-- Deployment arrows -->
  <line x1="141" y1="388" x2="141" y2="311" stroke="#57606A" stroke-width="1.6" marker-end="url(#aD)"/>
  <text x="150" y="356" class="lbl" fill="#57606A">terraform apply</text>
  <line x1="226" y1="428" x2="342" y2="428" stroke="#57606A" stroke-width="1.6" marker-end="url(#aD)" marker-start="url(#aD)"/>
  <text x="284" y="418" class="lbl" text-anchor="middle">state read / write</text>

  <!-- One-off bootstrap -->
  <path d="M141,468 V522 H998 V311" fill="none" stroke="#8C959F" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#aB)"/>
  <text x="570" y="514" class="lbl" text-anchor="middle" fill="#57606A">one-off bootstrap · slack/ scripts with a temporary bot token</text>

  <!-- Legend -->
  <rect x="596" y="344" width="300" height="104" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/>
  <text x="612" y="368" class="nh">Legend</text>
  <line x1="612" y1="390" x2="652" y2="390" stroke="#D9480F" stroke-width="2" marker-end="url(#aA)"/>
  <text x="664" y="394" class="nt" fill="#1F2328">Alert flow (numbered in order)</text>
  <line x1="612" y1="412" x2="652" y2="412" stroke="#57606A" stroke-width="1.6" marker-end="url(#aD)"/>
  <text x="664" y="416" class="nt" fill="#1F2328">Deployment with Terraform</text>
  <line x1="612" y1="434" x2="652" y2="434" stroke="#8C959F" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#aB)"/>
  <text x="664" y="438" class="nt" fill="#1F2328">One-off Slack bootstrap</text>
</svg>
